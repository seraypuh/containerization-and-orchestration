# docker-compose.yml
version: '3.8'
services:
  db:
    image: postgres:15
    container_name: pukharev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - pukharev-pgdata:/var/lib/postgresql/data
    networks:
      - pukharev-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: pukharev-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - pukharev-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pukharev-assistant
    restart: unless-stopped
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      CACHE_TTL: ${CACHE_TTL}
    ports:
      - "${APP_PORT}:5433"
    networks:
      - pukharev-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  pukharev-pgdata:
networks:  
  pukharev-backend:
    driver: bridge